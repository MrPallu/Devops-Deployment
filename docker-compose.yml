services:
  flask:
    build: .
    container_name: flask-container
    expose:
      - "5000"
    cap_drop:
      - ALL

  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
