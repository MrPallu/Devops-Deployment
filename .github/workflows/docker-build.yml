
name: Docker Build CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-flask-app .

      - name: Run Docker Container
        run: docker run -d -p 5000:5000 --name flask-test devops-flask-app

      - name: Test Health Endpoint
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Stop Test Container
        if: always()
        run: docker rm -f flask-test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-flask-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-flask-app:latest

